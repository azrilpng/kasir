<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Gorengan Barokah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--surface:#fff;--ink:#16261f;--muted:#66736c;--line:#e1ddd0;--green:#14513a;--green-ink:#fff;--gold:#f0b429;--gold-ink:#3a2a00;--red:#b3341f;--soft:#eaf1ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--surface:#18231d;--ink:#eef2ee;--muted:#9baba2;--line:#2a3830;--green:#4fb98a;--green-ink:#052016;--gold:#f0b429;--gold-ink:#2b1f00;--red:#ff8a73;--soft:#1f2e26}}
:root[data-theme="dark"]{--bg:#0f1713;--surface:#18231d;--ink:#eef2ee;--muted:#9baba2;--line:#2a3830;--green:#4fb98a;--green-ink:#052016;--gold:#f0b429;--gold-ink:#2b1f00;--red:#ff8a73;--soft:#1f2e26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "DM Sans",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--green);color:var(--green-ink);padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font:800 22px "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.3px}
header small{opacity:.8;display:block;font-size:12px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:transparent;color:inherit;padding:8px 14px;border-radius:8px;font-weight:700;opacity:.8}
nav button[aria-current="true"]{background:var(--gold);color:var(--gold-ink);opacity:1}
main{max-width:1100px;margin:0 auto;padding:16px}
.pos{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:820px){.pos{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;position:relative;transition:transform .08s}
.item:active{transform:scale(.96)}
.item .em{font-size:34px;display:block}
.item b{display:block;margin-top:4px}
.item span.p{color:var(--muted);font-size:13px}
.item .badge{position:absolute;top:6px;right:6px;background:var(--gold);color:var(--gold-ink);font-weight:800;min-width:24px;height:24px;border-radius:12px;font-size:13px;display:grid;place-items:center;padding:0 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.cart{position:sticky;top:12px}
.cart h2,h2.t{font:800 18px "Bricolage Grotesque",sans-serif;margin:0 0 10px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.line small{color:var(--muted);display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;background:var(--soft);font-weight:800}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.total{display:flex;justify-content:space-between;font:800 22px "Bricolage Grotesque",sans-serif;margin:12px 0}
.btn{background:var(--green);color:var(--green-ink);padding:13px;border-radius:10px;font-weight:700;width:100%}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:92vh;overflow:auto}
input{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.quick button{background:var(--soft);padding:10px 4px;border-radius:8px;font-weight:700}
.change{font-weight:800;font-size:18px;margin:8px 0}
.ok{color:var(--green)}.bad{color:var(--red)}
.receipt{font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px;border:1px dashed var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat b{display:block;font:800 24px "Bricolage Grotesque",sans-serif}
.stat span{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
.form{display:grid;grid-template-columns:70px 1fr 120px auto;gap:8px;margin-bottom:12px}
@media(max-width:560px){.form{grid-template-columns:70px 1fr}.form .btn{grid-column:1/-1}}
.x{background:transparent;color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:30}
@media print{header,main,.toast,.modal .btn,.modal .row{display:none!important}.modal{position:static;background:none;display:block}}
</style>
</head>
<body>
<header>
  <div><h1>Gorengan Barokah</h1><small>Sistem kasir</small></div>
  <nav>
    <button data-v="kasir">Kasir</button>
    <button data-v="laporan">Laporan</button>
    <button data-v="menu">Menu</button>
  </nav>
</header>
<main id="app"></main>

<div class="modal" id="payModal"><div class="box" id="payBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const DEFAULT = [
 {id:1,n:'Bakwan',p:1000,e:'🥬'},{id:2,n:'Tahu isi',p:1500,e:'🍢'},{id:3,n:'Tempe goreng',p:1000,e:'🟫'},
 {id:4,n:'Pisang goreng',p:2000,e:'🍌'},{id:5,n:'Ote-ote',p:1500,e:'🥕'},{id:6,n:'Risol',p:2500,e:'🌯'},
 {id:7,n:'Cireng',p:1000,e:'⚪'},{id:8,n:'Singkong goreng',p:1500,e:'🍠'},{id:9,n:'Combro',p:1500,e:'🧆'},
 {id:10,n:'Tahu crispy',p:1000,e:'🔶'},{id:11,n:'Cabai rawit',p:500,e:'🌶️'},{id:12,n:'Es teh',p:3000,e:'🧋'}
];
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let products = load('gb_products', DEFAULT);
let sales = load('gb_sales', []);
let cart = {};
let view = 'kasir';
const $ = s => document.querySelector(s);
const app = $('#app');

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cartItems(){return Object.entries(cart).map(([id,q])=>({p:products.find(x=>x.id==id),q})).filter(x=>x.p)}
function total(){return cartItems().reduce((s,x)=>s+x.p.p*x.q,0)}

function setView(v){
  view=v;
  try{history.replaceState(null,'','#'+v)}catch(e){}
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v));
  render();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

function render(){ view==='kasir'?renderKasir():view==='laporan'?renderLaporan():renderMenu(); }

function renderKasir(){
  app.innerHTML = `<div class="pos">
    <section><div class="grid" id="grid"></div></section>
    <aside class="panel cart"><h2>Pesanan</h2><div id="lines"></div>
      <div class="total"><span>Total</span><span id="tot"></span></div>
      <button class="btn" id="payBtn">Bayar</button>
      <div class="row"><button class="btn ghost" id="clr">Kosongkan</button></div>
    </aside></div>`;
  $('#grid').innerHTML = products.map(p=>`<button class="item" data-id="${p.id}">
    ${cart[p.id]?`<span class="badge">${cart[p.id]}</span>`:''}<span class="em">${esc(p.e)}</span><b>${esc(p.n)}</b><span class="p">${rp(p.p)}</span></button>`).join('')
    || '<div class="empty">Belum ada menu. Tambahkan di tab Menu.</div>';
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{cart[b.dataset.id]=(cart[b.dataset.id]||0)+1;renderKasir()});
  renderCart();
  $('#clr').onclick=()=>{cart={};renderKasir()};
  $('#payBtn').onclick=openPay;
}
function renderCart(){
  const items=cartItems();
  $('#lines').innerHTML = items.length ? items.map(({p,q})=>`<div class="line">
    <div><b>${esc(p.n)}</b><small>${rp(p.p)} × ${q}</small></div>
    <div class="qty"><button data-d="-1" data-id="${p.id}" aria-label="Kurangi ${esc(p.n)}">−</button><span>${q}</span><button data-d="1" data-id="${p.id}" aria-label="Tambah ${esc(p.n)}">+</button></div>
    <b>${rp(p.p*q)}</b></div>`).join('') : '<div class="empty">Ketuk gorengan untuk menambah pesanan.</div>';
  $('#tot').textContent=rp(total());
  $('#payBtn').disabled=!items.length;
  document.querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;cart[id]=(cart[id]||0)+Number(b.dataset.d);if(cart[id]<=0)delete cart[id];renderKasir()});
}

function openPay(){
  const t=total(); if(!t)return;
  const box=$('#payBox');
  box.innerHTML=`<h2 class="t">Pembayaran</h2>
    <div class="total"><span>Total</span><span>${rp(t)}</span></div>
    <label for="cash">Uang diterima</label>
    <input id="cash" type="number" inputmode="numeric" min="0" placeholder="0">
    <div class="quick"><button data-v="${t}">Uang pas</button>${[5000,10000,20000,50000,100000].map(v=>`<button data-v="${v}">${rp(v)}</button>`).join('')}</div>
    <div class="change" id="chg"></div>
    <div class="row"><button class="btn ghost" id="cancel">Batal</button><button class="btn" id="ok" disabled>Selesaikan</button></div>`;
  $('#payModal').classList.add('on');
  const cash=$('#cash');
  const upd=()=>{const c=Number(cash.value)||0,d=c-t;
    $('#chg').innerHTML = c? (d>=0?`Kembalian: <span class="ok">${rp(d)}</span>`:`<span class="bad">Kurang ${rp(-d)}</span>`):'';
    $('#ok').disabled = d<0||!c};
  cash.oninput=upd;
  box.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{cash.value=b.dataset.v;upd()});
  $('#cancel').onclick=()=>$('#payModal').classList.remove('on');
  $('#ok').onclick=()=>{
    const c=Number(cash.value);
    const sale={id:Date.now(),t:new Date().toISOString(),total:t,cash:c,change:c-t,items:cartItems().map(({p,q})=>({n:p.n,p:p.p,q}))};
    sales.push(sale);save('gb_sales',sales);cart={};showReceipt(sale);renderKasir();
  };
  cash.focus();
}
function receiptText(s){
  const d=new Date(s.t);const w=32;
  const pad=(a,b)=>a+' '.repeat(Math.max(1,w-a.length-b.length))+b;
  return ['GORENGAN BAROKAH',d.toLocaleString('id-ID'),'-'.repeat(w),
    ...s.items.map(i=>pad(`${i.n} x${i.q}`,rp(i.p*i.q))),'-'.repeat(w),
    pad('Total',rp(s.total)),pad('Tunai',rp(s.cash)),pad('Kembali',rp(s.change)),'','Terima kasih, semoga berkah!'].join('\n');
}
function showReceipt(s){
  $('#payBox').innerHTML=`<h2 class="t">Transaksi selesai</h2><div class="receipt">${esc(receiptText(s))}</div>
    <div class="row"><button class="btn ghost" id="pr">Cetak struk</button><button class="btn" id="done">Transaksi baru</button></div>`;
  $('#pr').onclick=()=>window.print();
  $('#done').onclick=()=>$('#payModal').classList.remove('on');
}

function sameDay(a,b){return a.toDateString()===b.toDateString()}
function renderLaporan(){
  const today=sales.filter(s=>sameDay(new Date(s.t),new Date()));
  const rev=today.reduce((a,s)=>a+s.total,0), pcs=today.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.q,0),0);
  const by={};today.forEach(s=>s.items.forEach(i=>{by[i.n]=by[i.n]||{q:0,r:0};by[i.n].q+=i.q;by[i.n].r+=i.q*i.p}));
  const rows=Object.entries(by).sort((a,b)=>b[1].q-a[1].q);
  app.innerHTML=`<div class="stats">
    <div class="panel stat"><b>${rp(rev)}</b><span>Pendapatan hari ini</span></div>
    <div class="panel stat"><b>${today.length}</b><span>Transaksi</span></div>
    <div class="panel stat"><b>${pcs}</b><span>Porsi terjual</span></div>
    <div class="panel stat"><b>${today.length?rp(rev/today.length):'Rp0'}</b><span>Rata-rata per transaksi</span></div></div>
    <div class="pos"><div class="panel"><h2 class="t">Terjual hari ini</h2>
    ${rows.length?`<div class="scroll"><table><tr><th>Menu</th><th class="r">Jumlah</th><th class="r">Omzet</th></tr>${rows.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="r">${v.q}</td><td class="r">${rp(v.r)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Belum ada penjualan hari ini.</div>'}</div>
    <div class="panel"><h2 class="t">Riwayat transaksi</h2>
    ${today.length?`<div class="scroll"><table>${today.slice().reverse().map(s=>`<tr><td>${new Date(s.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</td><td>${s.items.reduce((a,i)=>a+i.q,0)} item</td><td class="r">${rp(s.total)}</td><td><button class="x" data-r="${s.id}">Lihat</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Kosong.</div>'}
    <div class="row"><button class="btn ghost" id="reset">Hapus semua data penjualan</button></div></div></div>`;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{showReceipt(sales.find(s=>s.id==b.dataset.r));$('#payModal').classList.add('on')});
  $('#reset').onclick=()=>{ if($('#reset').dataset.c){sales=[];save('gb_sales',sales);renderLaporan();toast('Data penjualan dihapus')}else{$('#reset').dataset.c=1;$('#reset').textContent='Ketuk lagi untuk menghapus semua';} };
}

function renderMenu(){
  app.innerHTML=`<div class="panel"><h2 class="t">Kelola menu</h2>
    <div class="form"><input id="ne" placeholder="🍤" maxlength="4" aria-label="Emoji"><input id="nn" placeholder="Nama gorengan" aria-label="Nama"><input id="np" type="number" inputmode="numeric" placeholder="Harga" aria-label="Harga"><button class="btn" id="add">Tambah</button></div>
    <div class="scroll"><table><tr><th></th><th>Nama</th><th class="r">Harga</th><th></th></tr>
    ${products.map(p=>`<tr><td>${esc(p.e)}</td><td>${esc(p.n)}</td><td class="r"><input data-p="${p.id}" type="number" value="${p.p}" style="width:100px;text-align:right" aria-label="Harga ${esc(p.n)}"></td><td><button class="x" data-d="${p.id}">Hapus</button></td></tr>`).join('')}</table></div></div>`;
  $('#add').onclick=()=>{
    const n=$('#nn').value.trim(),p=Number($('#np').value);
    if(!n||!p){toast('Isi nama dan harga dulu');return}
    products.push({id:Date.now(),n,p,e:$('#ne').value.trim()||'🍤'});save('gb_products',products);renderMenu();toast(n+' ditambahkan');
  };
  document.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{const p=products.find(x=>x.id==i.dataset.p);p.p=Number(i.value)||p.p;save('gb_products',products);toast('Harga disimpan')});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{products=products.filter(x=>x.id!=b.dataset.d);delete cart[b.dataset.d];save('gb_products',products);renderMenu()});
}

$('#payModal').addEventListener('click',e=>{if(e.target.id==='payModal')e.target.classList.remove('on')});
const h=location.hash.replace('#','');
setView(['kasir','laporan','menu'].includes(h)?h:'kasir');
</script>
</body>
</html>
